Terminator = CR LF;
path="%#/\//\\/";

ReadTimeout = 200;
WriteTimeout = 200;
ReplyTimeout = 100;
LockTimeout = 15000;

@replytimeout {
    disconnect;
	wait 100;
	connect 100;
	wait 100;
	out "*IDN? ";
	wait 5000;
}

getString {
    out "LVGET \${1}" ${path} ",\$2";
    in "%#s";
}
sendString {
    out "LVPUT \$1" ${path} ",\$2,%s";
    @init { getString; }
}

