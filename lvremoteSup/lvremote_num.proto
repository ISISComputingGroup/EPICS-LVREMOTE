# changes '/' to '\' in paths to avoid excessive escape characters 
path="%#/\//\\/";
VARIABLES = "\$1" ${path} ",\$2";
LVGET ="LVGET " ${VARIABLES} "%l";
LVPUT ="LVPUT " ${VARIABLES};

ReadTimeout = 20;
WriteTimeout = 200;
ReplyTimeout = 100;
LockTimeout = 5000;

reconnect {
    # This doesn't seem to work if sent directly via streamdevice port
	# that autoreconnects. Send it via explicit NUMINIT port instead.
    exec "asynOctetWrite(\"NUMINIT\" \"*IDN? \")";
}

getDoubleVal {
    out ${LVGET};
    in "%l%8R";
}
setDoubleVal {
    out ${LVPUT} ",%8R%l";
    @init { getDoubleVal }
}

getBoolVal {
    out ${LVGET};
    in "%l%r"
}
setBoolVal {
    out ${LVPUT} ",%r%l";
    @init { getBoolVal }
}

getEnumVal {
    out ${LVGET};
    in "%l%2r";
}

setEnumVal {
    out ${LVPUT} ",%2r%l";
    @init { getEnumVal }
}

getArrayVal {
    out ${LVGET};
    in "%l%*4r%8R";
}

getIntVal {
    out ${LVGET};
    in "%l%4r";
}

setIntVal {
    out ${LVPUT} ",%0.4r%l";
    @init { getIntVal }
}

getFloatVal {
    out ${LVGET};
    in "%l%4R";
}

setFloatVal {
    out ${LVPUT} ",%4R%l";
    @init { getFloatVal }
}

