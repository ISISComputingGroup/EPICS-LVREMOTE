# changes '/' to '\' in paths to avoid excessive escape characters 
path="%#/\//\\/";
VARIABLES = "\$1" ${path} ",\$2";
LVGET ="LVGET " ${VARIABLES} "%l";
LVPUT ="LVPUT " ${VARIABLES};

ReadTimeout = 200;
WriteTimeout = 200;
ReplyTimeout = 100;
LockTimeout = 15000;

@replytimeout {
    disconnect;
	wait 100;
	connect 100;
	wait 100;
	out "*IDN? ";
	wait 5000;
}

getDoubleVal {
    out ${LVGET};
    in "%l%8R";
}
setDoubleVal {
    out ${LVPUT} ",%8R%l";
    @init { getDoubleVal }
}

getBoolVal {
    out ${LVGET};
    in "%l%r"
}
setBoolVal {
    out ${LVPUT} ",%r%l";
    @init { getBoolVal }
}

getEnumVal {
    out ${LVGET};
    in "%l%2r";
}

setEnumVal {
    out ${LVPUT} ",%2r%l";
    @init { getEnumVal }
}

getArrayVal {
    out ${LVGET};
    in "%l%*4r%8R";
}

getIntVal {
    out ${LVGET};
    in "%l%4r";
}

setIntVal {
    out ${LVPUT} ",%0.4r%l";
    @init { getIntVal }
}

